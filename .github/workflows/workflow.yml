name: Build

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**', 'art/**' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**', 'art/**' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HAXE_VERSION: 4.3.7

jobs:
  buildAndroid:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/
            !/hello_leather_engine_fans.gif

      - name: Use Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Restore Haxelib Cache
        id: haxelib-cache
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-android-${{ env.HAXE_VERSION }}-${{ hashFiles('.github/scripts/install-libs.sh') }}

      - name: Restore hxcpp Cache
        uses: actions/cache@v4
        with:
          path: ~/.hxcpp_cache
          key: hxcpp-android-${{ github.sha }}
          restore-keys: hxcpp-android-

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('Project.xml', '.github/scripts/install-libs.sh') }}
          restore-keys: gradle-

      - name: Install Haxelib
        run: |
          mkdir -p ~/.hxcpp_cache
          echo "HXCPP_COMPILE_CACHE=$HOME/.hxcpp_cache" >> $GITHUB_ENV
          echo "HXCPP_COMPILE_THREADS=$(nproc)" >> $GITHUB_ENV
          echo "GRADLE_OPTS=-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.vfs.watch=false" >> $GITHUB_ENV
          haxelib setup ~/haxelib
          if [ "${{ steps.haxelib-cache.outputs.cache-hit }}" != "true" ]; then
            sh ./.github/scripts/install-libs.sh
          fi

      - name: Use Bundled Lua
        run: |
          LUA_PATH=$(haxelib libpath linc_luajit)
          for LIB in "$LUA_PATH"/lib/lua/lib/Android/*.a; do printf '!<arch>\n' > "$LIB"; done

      - name: Check NDK
        run: |
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          ls "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/c++/v1/typeinfo"

      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Prepare Signing Key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> $GITHUB_ENV
          else
            keytool -genkeypair -keystore "$KEYSTORE" -storepass android -keypass android -alias leather -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=LeatherEngine,O=BrenninhoTools,C=BR"
            echo "ANDROID_KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=leather" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=android" >> $GITHUB_ENV
          fi
          echo "ANDROID_KEYSTORE=$KEYSTORE" >> $GITHUB_ENV

      - name: Compile
        run: |
          set -o pipefail
          if ! haxelib run lime build android -final -D ANDROID_SIGNING 2>&1 | tee compile.log; then
            grep -n -i -E "error|failed|exception" compile.log | tail -n 40 > errors.log || true
            echo "::error title=lime build android::$(sed 's/%/%25/g' errors.log | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Collect APK
        run: |
          APK=$(find export/release/android/bin/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "APK not found"; exit 1; fi
          mkdir -p dist
          cp "$APK" dist/LeatherEngine.apk

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: androidBuild
          path: dist/LeatherEngine.apk
          if-no-files-found: error
          compression-level: 0

  buildiOS:
    name: iOS
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/
            !/hello_leather_engine_fans.gif

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Restore Haxelib Cache
        id: haxelib-cache
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-ios-${{ env.HAXE_VERSION }}-${{ hashFiles('.github/scripts/install-libs.sh') }}

      - name: Restore hxcpp Cache
        uses: actions/cache@v4
        with:
          path: ~/.hxcpp_cache
          key: hxcpp-ios-${{ github.sha }}
          restore-keys: hxcpp-ios-

      - name: Install Haxelib
        run: |
          mkdir -p ~/.hxcpp_cache
          echo "HXCPP_COMPILE_CACHE=$HOME/.hxcpp_cache" >> $GITHUB_ENV
          echo "HXCPP_COMPILE_THREADS=$(sysctl -n hw.ncpu)" >> $GITHUB_ENV
          arch -x86_64 haxelib setup ~/haxelib
          if [ "${{ steps.haxelib-cache.outputs.cache-hit }}" != "true" ]; then
            arch -x86_64 /bin/sh ./.github/scripts/install-libs.sh
          fi

      - name: Use Bundled Lua
        run: |
          LUA_PATH=$(arch -x86_64 haxelib libpath linc_luajit)
          mkdir -p "$LUA_PATH/lib/lua/lib/iPhone"
          printf '!<arch>\n' > "$LUA_PATH/lib/lua/lib/iPhone/libluajit.iphoneos-64.a"
          printf '!<arch>\n' > "$LUA_PATH/lib/lua/lib/iPhone/libluajit.iphonesim-64.a"

      - name: Generate Xcode Project
        run: |
          arch -x86_64 haxelib run lime update ios 2>&1 | tee compile.log || true
          if ! ls export/release/ios/*.xcodeproj > /dev/null 2>&1; then
            echo "::error title=lime update ios::$(tail -n 60 compile.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Compile
        run: |
          set -o pipefail
          cd export/release/ios
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          if ! xcodebuild -project "$PROJECT" -configuration Release -sdk iphoneos -arch arm64 -jobs $(sysctl -n hw.ncpu) \
            ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO DEBUG_INFORMATION_FORMAT=dwarf \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee ../../../xcode.log; then
            grep -n -E "error:|Error |\*\* BUILD FAILED" ../../../xcode.log | tail -n 40 > ../../../errors.log || true
            echo "::error title=xcodebuild::$(sed 's/%/%25/g' ../../../errors.log | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Package IPA
        run: |
          APP=$(find export/release/ios/build -type d -name "*.app" -path "*iphoneos*" | head -n 1)
          if [ -z "$APP" ]; then echo "No .app found"; exit 1; fi
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa && zip -qry -1 ../LeatherEngine.ipa Payload

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSBuild
          path: LeatherEngine.ipa
          if-no-files-found: error
          compression-level: 0
